name: Publicar mural

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      - name: Instalar ffmpeg (so se tiver video)
        if: hashFiles('midia/*.mp4', 'midia/*.MP4', 'midia/*.mov', 'midia/*.MOV', 'midia/*.m4v', 'midia/*.mkv', 'midia/*.webm') != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - uses: actions/cache@v4
        with:
          path: .cache
          key: mural-${{ github.run_id }}
          restore-keys: mural-

      - run: python gerar_playlist.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
